# The Vessel custom resource (plan: claude/Taso_plan_k8s_docker_2026-10-17.md, K1).
#
# Kubernetes stores the intent; the Warden owns the agent.  A Vessel names
# what to run and on which node; the taso-wardend DaemonSet pod on that node
# watches Vessels with `spec.node` = its node, starts and stops the agent
# itself (under runc/runsc, inside its own pod), and reports `status`.
# There is no pod per agent and no volume: Vessel data is reachable only
# through the Warden (v1.0 §7, negative space).
#
# Identity.  A Vessel's Chronicle id is derived from (spec.tenant,
# spec.subject), and its host uid range from spec.uidSlot, which it keeps on
# every node (amendment 20).  All three are fixed once set: changing them
# would silently point the resource at another Vessel or another uid range.
# Deleting the resource stops the agent; it does not delete data (purge is
# a sanction-loop rule, not a delete).
#
# Moving a Vessel (rebirth on another node) is an operator action: set
# spec.node to the new node and spec.takeover to the holder and epoch being
# replaced, as status.holder and status.epoch show them.  The takeover is
# one-shot by construction: it names the epoch it replaces, so once the
# epoch has moved it refuses itself (fencing review F1/F2: the Warden checks
# it with a conditional transfer).  A standing "takeover: true" does not
# exist on purpose.
#
# Not yet carried by the daemon (K2 adds them): per-Vessel rootfs, args, env
# and limits (the daemon config has them per node today), and the watch
# itself.  Names of fields follow Kubernetes conventions (camelCase); the
# daemon's JSON config uses snake_case for the same values.
#
# Group: taso.suocommerce.com (a domain the project owns).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vessels.taso.suocommerce.com
spec:
  group: taso.suocommerce.com
  scope: Namespaced
  names:
    kind: Vessel
    listKind: VesselList
    plural: vessels
    singular: vessel
    shortNames: [vsl]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # Each Warden lists only its own node's Vessels, filtered by the API
      # server (--field-selector spec.node=<node>); GA in Kubernetes 1.32.
      # RBAC cannot restrict reads by field: this narrows what a Warden
      # asks for, it is not an access boundary.
      selectableFields:
        - jsonPath: .spec.node
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Node
          type: string
          jsonPath: .spec.node
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Holder
          type: integer
          jsonPath: .status.holder
        - name: Epoch
          type: integer
          jsonPath: .status.epoch
        - name: Turn
          type: integer
          description: The last sealed turn.
          jsonPath: .status.lastSeal.turn
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [tenant, subject, uidSlot, node, rootfs, args]
              x-kubernetes-validations:
                - rule: has(self.fork) == has(oldSelf.fork)
                  message: fork is fixed once set (give it when the Vessel is created)
              properties:
                tenant:
                  type: string
                  description: >-
                    Taso namespace of the Vessel (16 bytes as 32 lowercase hex
                    digits).  Called tenant here so it is not confused with the
                    Kubernetes namespace.  Fixed once set.
                  pattern: '^[0-9a-f]{32}$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: tenant is fixed once set
                subject:
                  type: string
                  description: >-
                    Stable owner key of the Vessel within its tenant (never a
                    display name).  With tenant it derives the Vessel's id.
                    Fixed once set.
                  minLength: 1
                  maxLength: 256
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: subject is fixed once set
                uidSlot:
                  type: integer
                  format: int64
                  description: >-
                    Host uid/gid range slot: host_uid_base + uidSlot·65536,
                    65536 ids.  No two Vessels on a node may share one.  Kept
                    on every node; fixed once set.  The Warden refuses a slot
                    whose range does not fit its node's base.
                  minimum: 0
                  maximum: 65000
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: uidSlot is fixed once set
                node:
                  type: string
                  description: >-
                    The Kubernetes node whose Warden runs this Vessel.
                    Changing it moves the Vessel (rebirth there); while
                    another Warden holds it, the move also needs
                    spec.takeover.
                  minLength: 1
                  maxLength: 253
                fork:
                  type: object
                  description: >-
                    Fork this Vessel from another of the same tenant instead
                    of a birth from the void: its first start forks it from
                    the parent's accepted Seal, read from the parent's log on
                    this node (the parent must have run on spec.node), and it
                    runs over the parent's files through an idmapped mount in
                    its own uidSlot.  Its turns continue the parent's.  Fixed
                    once set, and only at creation.
                  required: [parent]
                  properties:
                    parent:
                      type: string
                      description: The parent's subject (same tenant).
                      minLength: 1
                      maxLength: 256
                    seal:
                      type: string
                      description: >-
                        Which accepted Seal: "last" (the default: the newest
                        when the fork is made) or an lsn.
                      pattern: '^(last|[1-9][0-9]{0,18})$'
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: fork is fixed once set
                takeover:
                  type: object
                  description: >-
                    One-shot takeover: fence the named holder at the named
                    epoch and take the Vessel over on spec.node.  Refused if
                    the holder or epoch has changed since (a stale takeover
                    refuses itself).  Copy both from status.
                  required: [holder, epoch]
                  properties:
                    holder:
                      type: integer
                      format: int64
                      description: The WardenId being replaced (status.holder).
                      minimum: 0
                    epoch:
                      type: integer
                      format: int64
                      description: Its epoch (status.epoch).
                      minimum: 1
                rootfs:
                  type: object
                  description: >-
                    The agent's root filesystem.  For now a directory already
                    on the node (read-only); an image reference comes with
                    Template genesis from oci:// (v1.0 §4).
                  required: [path]
                  properties:
                    path:
                      type: string
                      pattern: '^/'
                      maxLength: 4096
                args:
                  type: array
                  description: The agent's command line inside its rootfs.
                  minItems: 1
                  items:
                    type: string
                env:
                  type: array
                  description: The agent's environment, NAME=value.  Nothing else is passed.
                  items:
                    type: string
                    pattern: '^[A-Za-z_][A-Za-z0-9_]*='
                landlock:
                  type: boolean
                  description: Run the agent through the Landlock shim (it must be in the rootfs).
                  default: true
                resources:
                  type: object
                  properties:
                    memory:
                      description: Memory limit, a Kubernetes quantity (e.g. 256Mi).
                      anyOf:
                        - type: integer
                        - type: string
                      x-kubernetes-int-or-string: true
                      pattern: '^[0-9]+(\.[0-9]+)?(Ki|Mi|Gi|Ti|k|M|G|T)?$'
                    pids:
                      type: integer
                      format: int64
                      description: Maximum number of processes.
                      minimum: 1
                quiescence:
                  type: array
                  description: >-
                    Database files the Warden watches for quiescence at a turn
                    boundary (SQLite WAL/journal, by name inside the dataset).
                  items:
                    type: string
            status:
              type: object
              description: Written by the Warden holding the Vessel.
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                phase:
                  type: string
                  description: >-
                    Pending (not started yet), Running (agent up), Exited
                    (agent ended), Refused (held by another Warden, or a
                    stale takeover), Failed (could not start; see message).
                  enum: [Pending, Running, Exited, Refused, Failed]
                holder:
                  type: integer
                  format: int64
                  description: The WardenId holding the Vessel at the coordinator.
                epoch:
                  type: integer
                  format: int64
                  description: The holder's epoch at the coordinator.
                start:
                  type: string
                  description: How the last start went (Birth, Open, Rebirth).
                  enum: [Birth, Open, Rebirth]
                lastSeal:
                  type: object
                  properties:
                    lsn:
                      type: integer
                      format: int64
                    turn:
                      type: integer
                      format: int64
                      description: The agent's turn (0 is the birth Seal).
                shippedAnchor:
                  type: integer
                  format: int64
                  description: The lsn the coordinator holds as shipped (rebirth goes up to it).
                settled:
                  type: object
                  description: What settling the state did before the agent ran.
                  properties:
                    birthSeal:
                      type: integer
                      format: int64
                      description: The birth Seal's lsn, if that start took it.
                    rolledBackTo:
                      type: integer
                      format: int64
                      description: The Seal the state was rolled back to.
                    behind:
                      type: boolean
                      description: The state is older than the last Seal (its layer was missing).
                message:
                  type: string
                  description: Why the last start was refused or failed, or how the agent exited.
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
