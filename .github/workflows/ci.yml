# CI: every push and every pull request (assurance plan 2026-10-20, item 1).
#
# Levels 1-3 of the plan: the model proptests, the conformance suite and
# the unit and component tests, plus lints and the supply chain.  Tests
# that need root, ZFS, ublk or runc are #[ignore] and run on taso-test
# (levels 4-5); nothing here touches a server.
#
# Every check here was run locally on gate/ci before this file was written
# (2026-10-21): fmt clean, clippy clean, 646 passed / 0 failed / 31
# ignored, shellcheck -S warning clean, cargo audit and cargo deny clean.
#
# "No merge to main on red" is a branch protection rule in the repo's
# settings (require the four jobs below), set by hand after the first
# green run.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:   # a newer push to the same ref cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The toolchain the repo was formatted and checked with.  Pinned so that
  # a new stable rustfmt or clippy cannot turn main red with no change in
  # the code; moved by hand, with the code fixed in the same commit.
  RUST_VERSION: "1.97.0"
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  rust:
    # Build, clippy and the tests share one target directory and one cache.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: libclang for libublk's bindgen (taso-blk's daemon feature)
        run: sudo apt-get update -q && sudo apt-get install -y -q libclang-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt   # rustfmt: bindgen formats its output with it
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets --all-features --locked
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-features --locked

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: shellcheck -s bash -S warning scripts/*.sh scripts/gate-cloud/*.sh

  supply-chain:
    # Advisories, licences and sources of every crate in Cargo.lock.  The
    # advisory list changes without any push, so a run can go red on an
    # unchanged commit: that is the point.  Known open ones are listed,
    # with reasons, in .cargo/audit.toml and deny.toml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
