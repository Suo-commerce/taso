[package]
name = "taso-warden"
description = "Taso Warden: the daemon side. Phase 1 starts with the ZFS driver (a Seal is a snapshot)."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taso-core = { path = "../taso-core" }
taso-field = { path = "../taso-field" }
# The block log as a storage backend (blk.rs): the store types and the
# client only, without the ublk daemon.
taso-blk = { path = "../taso-blk", default-features = false }
redb = { workspace = true }
blake3 = { workspace = true }
serde_json = { workspace = true }
# HTTP for S3 (s3.rs) and the Kubernetes API (kube.rs).  Its "rustls"
# feature is rustls with ring and the webpki-roots root store (1.x); a
# private CA is given through ureq::tls (s3::tls_trusting).  No gzip, no
# native TLS.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
hmac = "0.12"
sha2 = "0.10"
libc = "0.2"
# Safe `SO_PEERCRED` for the coordinator's peer map (coordsrv.rs); the
# crate forbids unsafe code.  Already in the tree through tempfile.
rustix = { version = "1", features = ["net", "time"] }

[dev-dependencies]
proptest = { workspace = true }
tempfile = { workspace = true }
