[package]
name = "taso-blk"
description = "Taso block log spike: a userspace block device whose fork is a parent pointer (Phase 4 slice, plan 2026-10-18)."
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["daemon"]
# The ublk daemon (taso-blkd).  Off for users of the library alone (the
# Warden's Pool and Layers use the store types and the client), so they do
# not build libublk and its bindgen/clang build dependency.
daemon = ["dep:libublk", "dep:libc", "dep:mimalloc"]

[[bin]]
name = "taso-blkd"
path = "src/bin/taso-blkd.rs"
required-features = ["daemon"]

[dependencies]
blake3 = { workspace = true }
taso-core = { path = "../taso-core" }
libublk = { version = "0.4.8", optional = true }
libc = { version = "0.2", optional = true }

# The static musl build's allocator (P5 C2, 2026-11-15): musl's own made
# the P=64 turn pause's p95 146 ms against glibc's 68-80 on taso-test.
# taso-blkd only (the daemon feature); glibc builds keep glibc's.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }
