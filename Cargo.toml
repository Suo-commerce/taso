[workspace]
resolver = "2"
members = ["crates/taso-blk", "crates/taso-core", "crates/taso-field", "crates/taso-landlock", "crates/taso-sim", "crates/taso-warden"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
blake3 = "1.8"
proptest = "1.12"
redb = "4.4"
tempfile = "3.27"
serde_json = "1.0"
